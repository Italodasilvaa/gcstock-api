# Esteira da API (GC Stock API + Worker): valida, gera as imagens e publica no Swarm da VPS.
#
# Fluxo: feature -> Pull Request (só valida) -> branch "stg" (publica em homologação) -> branch "prod" (publica em produção).
# Antes de publicar, faz BACKUP do banco: as migrations rodam sozinhas quando a API sobe.
# Segredos e configuração do repositório: veja deploy/PIPELINE.md.

name: Esteira da API

on:
  push:
    branches: [stg, prod]
  pull_request:
    branches: [main, stg, prod]

concurrency:
  group: esteira-api-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_URL: registry.iwsolutions.cloud
  API_IMAGE: gcstock-api
  WORKER_IMAGE: gcstock-worker
  POSTGRES_CONTAINER_FILTER: "^postgres"
  POSTGRES_USER: admin
  BACKUP_DIR: /var/backups/gcstock
  BACKUP_KEEP: "14"

jobs:
  build:
    name: Validar (build e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore GCStock.slnx
      - run: dotnet build GCStock.slnx --configuration Release --no-restore

      # Testes sem banco: bloqueiam a publicação se falharem.
      - name: dotnet test (sem banco)
        run: >
          dotnet test GCStock.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~GCStock.IntegrationTests.Purchasing&FullyQualifiedName!~GCStock.IntegrationTests.TenantIsolation"

      # Testes com PostgreSQL real (Testcontainers): informativos por enquanto, não bloqueiam.
      # Quando estiverem validados, remova o continue-on-error.
      - name: dotnet test (com PostgreSQL, informativo)
        continue-on-error: true
        run: >
          dotnet test GCStock.slnx --configuration Release --no-build
          --filter "FullyQualifiedName~GCStock.IntegrationTests.Purchasing|FullyQualifiedName~GCStock.IntegrationTests.TenantIsolation"

  deploy:
    name: Publicar (${{ github.ref_name == 'prod' && 'produção' || 'homologação' }})
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Em "production", configure Required reviewers no Environment (Settings > Environments) para exigir aprovação.
    environment: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
    env:
      ENVIRONMENT: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
      ASPNET_ENVIRONMENT: ${{ github.ref_name == 'prod' && 'Production' || 'Staging' }}
      STACK_NAME: ${{ github.ref_name == 'prod' && 'gcstock-prd' || 'gcstock-nprd' }}
      HOST_DOMAIN: ${{ github.ref_name == 'prod' && 'api.iwsolutions.cloud' || 'api-nprd.iwsolutions.cloud' }}
      DATABASE_NAME: ${{ github.ref_name == 'prod' && 'gcstock_prd' || 'gcstock_nprd' }}
      DOCKER_TAG: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build e push da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.API_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.REGISTRY_URL }}/${{ env.API_IMAGE }}:latest-${{ env.ENVIRONMENT }}

      - name: Build e push do Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.WORKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.REGISTRY_URL }}/${{ env.WORKER_IMAGE }}:latest-${{ env.ENVIRONMENT }}

      - name: Gerar stack.yml com placeholders substituídos
        run: |
          sed \
            -e "s|__REGISTRY_URL__|$REGISTRY_URL|g" \
            -e "s|__API_IMAGE_NAME__|$API_IMAGE|g" \
            -e "s|__WORKER_IMAGE_NAME__|$WORKER_IMAGE|g" \
            -e "s|__DOCKER_TAG__|$DOCKER_TAG|g" \
            -e "s|__ENVIRONMENT__|$ASPNET_ENVIRONMENT|g" \
            -e "s|__SERVICE_NAME__|$STACK_NAME|g" \
            -e "s|__HOST_DOMAIN__|$HOST_DOMAIN|g" \
            deploy/stacks/stack.yml > "stack.$ENVIRONMENT.yml"

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar stack.yml para a VPS
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /tmp/gcstock-deploy"
          scp -i ~/.ssh/id_deploy "stack.$ENVIRONMENT.yml" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/gcstock-deploy/"

      # Se o backup falhar, a publicação para aqui e nada é alterado.
      - name: Backup do banco (${{ env.DATABASE_NAME }}) antes do deploy
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            bash -s -- "$DATABASE_NAME" "$POSTGRES_USER" "${{ github.run_number }}" "$POSTGRES_CONTAINER_FILTER" "$BACKUP_DIR" "$BACKUP_KEEP" \
            < deploy/backup-db.sh

      - name: docker stack deploy
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker stack deploy --with-registry-auth -c /tmp/gcstock-deploy/stack.$ENVIRONMENT.yml $STACK_NAME"

      # Se a API não responder, a esteira falha e o Swarm volta sozinho (update_config.failure_action = rollback).
      - name: Verificar saúde da API
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "https://$HOST_DOMAIN/health/ready" > /dev/null; then
              echo "API no ar em https://$HOST_DOMAIN"; exit 0
            fi
            echo "Aguardando a API responder ($i/36)..."; sleep 5
          done
          echo "A API nao respondeu em https://$HOST_DOMAIN/health/ready"; exit 1
